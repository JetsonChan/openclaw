name: Fork CI

on:
  workflow_dispatch:
  push:
    branches: ["yueyue-prune-*", "yueyue-v2026.10.6"]
  pull_request:
    branches: ["yueyue-v2026.10.6"]

permissions:
  contents: read

env:
  # Build the complete selected graph; compose excluded first-party plugins
  # through the existing packer instead of changing selector semantics.
  OPENCLAW_BUNDLED_PLUGIN_BUILD_IDS: >-
    browser,codex,deepseek,document-extract,google,image-generation-core,imessage,
    memory-core,minimax,ollama,openai,opencode,opencode-go,volcengine,xai,zai
  # Existing packer selector for plugins excluded from the core package.
  OPENCLAW_INTERNAL_DOCKER_BUILD_PLUGIN_IDS: codex,imessage,deepseek,opencode,volcengine,zai
  FORK_BUNDLE_PLUGIN_IDS: codex,imessage,deepseek,opencode,volcengine,zai

jobs:
  static:
    name: Static and retained channel contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and frozen dependencies
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - run: pnpm config:channels:check
      - run: pnpm channels:catalog:check
      - run: pnpm tsgo:core
      - run: pnpm tsgo:extensions
      - run: pnpm test test/scripts/bundled-plugin-assets.test.ts test/scripts/native-protocol-artifact.test.ts packages/gateway-protocol/src/native-protocol-levels.guard.test.ts --maxWorkers=1
      - run: pnpm test:contracts:channels
      - run: pnpm test:contracts:plugins
      - run: pnpm test:extension imessage

  build:
    name: Selected build and package composition
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and frozen dependencies
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - run: pnpm build
      - name: Compose the selected package
        shell: bash
        run: |
          args=()
          IFS=',' read -ra ids <<< "$FORK_BUNDLE_PLUGIN_IDS"
          for id in "${ids[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"
            [ -n "$id" ] && args+=(--bundle-plugin "$id")
          done
          mkdir -p artifacts
          node --import ./scripts/tsx.mjs scripts/package-openclaw-for-docker.mts \
            --source-dir . \
            --output-dir artifacts \
            --output-name openclaw-yueyue.tgz \
            --allow-unreleased-changelog \
            --skip-build \
            "${args[@]}"
      - name: Verify selected distribution contents
        shell: bash
        run: |
          test ! -d dist/extensions/telegram
          test ! -d dist/extensions/discord
          tar -tzf artifacts/openclaw-yueyue.tgz > artifacts/contents.txt
          IFS=',' read -ra ids <<< "$OPENCLAW_BUNDLED_PLUGIN_BUILD_IDS"
          for id in "${ids[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"
            test -d "dist/extensions/$id"
            grep -q "package/dist/extensions/$id/" artifacts/contents.txt
          done
          if grep -qE 'package/dist/extensions/(telegram|discord|feishu|slack|whatsapp|signal)/' artifacts/contents.txt; then
            echo "non-target channel was packaged" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openclaw-yueyue-package
          path: artifacts/openclaw-yueyue.tgz
          if-no-files-found: error
